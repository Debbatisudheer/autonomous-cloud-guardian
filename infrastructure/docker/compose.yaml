services:
  postgres:
    image: postgres:18
    container_name: acg-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_dev_password

    ports:
      - "5433:5432"

    volumes:
      - acg_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: acg-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "6379:6379"

    volumes:
      - acg_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    container_name: acg-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    ports:
      - "9092:9092"

    volumes:
      - acg_kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: acg-seaweedfs
    restart: unless-stopped

    command:
      [
        "mini",
        "-dir=/data"
      ]

    environment:
      AWS_ACCESS_KEY_ID: guardian
      AWS_SECRET_ACCESS_KEY: guardian_dev_password
      S3_BUCKET: acg-storage

    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"

    volumes:
      - acg_seaweedfs_data:/data

volumes:
  acg_postgres_data:
  acg_redis_data:
  acg_kafka_data:
  acg_seaweedfs_data: